<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ANANTIX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <div class="login-container">
        <div class="login-box">
            <h2>Create Account</h2>
            <p>Join the ANANTIX Global Community</p>
            <form id="signupForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Sign Up</button>
            </form>
            <p class="signup-link">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.innerHTML = "Creating...";
            const res = await fetch('http://127.0.0.1:8000/api/auth/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if(res.ok) {
                alert("Account Created! Please Login.");
                window.location.href = 'login.html';
            } else {
                alert(data.detail || "Error creating account");
                btn.innerHTML = "Sign Up";
            }
        });
    </script>
</body>
</html>
